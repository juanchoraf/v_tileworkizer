name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Check tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          tag_version="${RELEASE_TAG#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Cargo.toml version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        shell: bash
        timeout-minutes: 15
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 dpkg-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - name: Build artifacts on Linux
        shell: bash
        timeout-minutes: 45
        run: bash scripts/build_binaries.sh --format deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v_tileworkizer-${{ matrix.name }}
          path: dist/v_tileworkizer-*-linux-*.deb
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            runner: macos-15-intel
            shell: bash
            command: python scripts/package.py
          - name: macos-arm64
            runner: macos-15
            shell: bash
            command: python scripts/package.py
          - name: windows-x86_64
            runner: windows-2025
            shell: pwsh
            command: python scripts/package.py

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        timeout-minutes: 10
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          tag_version="${RELEASE_TAG#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Cargo.toml version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Windows package tools
        if: matrix.shell == 'pwsh'
        shell: pwsh
        timeout-minutes: 15
        env:
          WIX7_EULA_ACCEPTED: ${{ vars.WIX7_EULA_ACCEPTED }}
        run: |
          if ($env:WIX7_EULA_ACCEPTED -ne 'true') {
            throw 'Review the WiX 7 OSMF EULA, then set the repository Actions variable WIX7_EULA_ACCEPTED to true.'
          }
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install WiX 7.' }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw 'Failed to accept the WiX 7 EULA.' }
          & $wix extension add -g WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install the WiX UI extension.' }

      - name: Prepare Windows code signing certificate
        if: matrix.shell == 'pwsh'
        shell: pwsh
        timeout-minutes: 2
        env:
          V_TILEWORKIZER_CODESIGN_PFX_BASE64: ${{ secrets.V_TILEWORKIZER_CODESIGN_PFX_BASE64 }}
          V_TILEWORKIZER_CODESIGN_PASSWORD: ${{ secrets.V_TILEWORKIZER_CODESIGN_PASSWORD }}
          V_TILEWORKIZER_CODESIGN_THUMBPRINT: ${{ secrets.V_TILEWORKIZER_CODESIGN_THUMBPRINT }}
          V_TILEWORKIZER_CODESIGN_TIMESTAMP_URL: ${{ secrets.V_TILEWORKIZER_CODESIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:V_TILEWORKIZER_CODESIGN_PFX_BASE64)) {
            Write-Host "No Windows code signing PFX secret configured."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:V_TILEWORKIZER_CODESIGN_PASSWORD)) {
            throw "Windows code signing PFX password is missing."
          }

          $certPath = Join-Path $env:RUNNER_TEMP "v_tileworkizer_codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:V_TILEWORKIZER_CODESIGN_PFX_BASE64))
          $password = ConvertTo-SecureString $env:V_TILEWORKIZER_CODESIGN_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object {
            $_.HasPrivateKey -and (
              [string]::IsNullOrWhiteSpace($env:V_TILEWORKIZER_CODESIGN_THUMBPRINT) -or
              $_.Thumbprint -eq $env:V_TILEWORKIZER_CODESIGN_THUMBPRINT
            )
          } | Select-Object -First 1
          if (-not $certificate) {
            throw "The PFX has no matching signing certificate with a private key."
          }
          "WINDOWS_SIGN_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not [string]::IsNullOrWhiteSpace($env:V_TILEWORKIZER_CODESIGN_TIMESTAMP_URL)) {
            "WINDOWS_TIMESTAMP_URL=$env:V_TILEWORKIZER_CODESIGN_TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Build artifacts on Unix
        if: matrix.shell == 'bash'
        shell: bash
        timeout-minutes: 45
        run: ${{ matrix.command }}

      - name: Build artifacts on Windows
        if: matrix.shell == 'pwsh'
        shell: pwsh
        timeout-minutes: 45
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v_tileworkizer-${{ matrix.name }}
          path: |
            dist/v_tileworkizer-*-macos-*.pkg
            dist/v_tileworkizer-*-windows-*.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets-flat
          find release-assets -type f \( \
            -name 'v_tileworkizer-*-linux-*.deb' -o \
            -name 'v_tileworkizer-*-macos-*.pkg' -o \
            -name 'v_tileworkizer-*-windows-*.msi' \) \
            -exec cp -f {} release-assets-flat/ \;

          asset_count=$(find release-assets-flat -maxdepth 1 -type f | wc -l)
          if [ "$asset_count" -ne 5 ]; then
            echo "Expected five native installers, found $asset_count" >&2
            find release-assets -maxdepth 4 -print >&2
            exit 1
          fi

          find release-assets-flat -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: v_tileworkizer ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: release-assets-flat/*
          fail_on_unmatched_files: true
